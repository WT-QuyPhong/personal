<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>@painkiller | Bio Link</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --neon-color: #a855f7;
      --neon-glow: rgba(168, 85, 247, 0.45);
      --neon-secondary: #06b6d4;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      user-select: none;
    }

    body {
      font-family: 'Space Grotesk', sans-serif;
      background-color: #060609;
      color: #f8fafc;
      height: 100vh;
      max-height: 100vh;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .cyber-bg {
      position: fixed;
      inset: 0;
      z-index: -2;
      background: 
        radial-gradient(circle at 20% 25%, rgba(168, 85, 247, 0.16), transparent 40%),
        radial-gradient(circle at 80% 75%, rgba(6, 182, 212, 0.14), transparent 40%),
        linear-gradient(180deg, #040407 0%, #0b0914 100%);
    }

    .cyber-grid {
      position: fixed;
      inset: 0;
      z-index: -1;
      background-image: 
        linear-gradient(to right, rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(to bottom, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 38px 38px;
      mask-image: radial-gradient(circle at center, black 45%, transparent 90%);
      -webkit-mask-image: radial-gradient(circle at center, black 45%, transparent 90%);
    }

    #enterOverlay {
      position: fixed;
      inset: 0;
      z-index: 99999;
      background: rgba(5, 5, 8, 0.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: opacity 0.6s ease, visibility 0.6s ease;
    }

    #enterOverlay.hidden-overlay {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .pulse-text {
      font-family: 'JetBrains Mono', monospace;
      letter-spacing: 0.2em;
      text-shadow: 0 0 15px var(--neon-glow), 0 0 30px var(--neon-glow);
      animation: pulseGlow 2s infinite ease-in-out;
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.55; transform: scale(0.98); }
      50% { opacity: 1; transform: scale(1.03); }
    }

    .tilt-wrapper {
      perspective: 1100px;
      width: 100%;
      max-width: 400px;
      padding: 0.75rem;
      z-index: 10;
      max-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .bio-card {
      background: rgba(15, 15, 24, 0.72);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.09);
      border-radius: 20px;
      padding: 1.25rem 1.25rem;
      box-shadow: 
        0 20px 45px -10px rgba(0, 0, 0, 0.85),
        0 0 25px -6px var(--neon-glow);
      transform-style: preserve-3d;
      transition: transform 0.15s ease-out, box-shadow 0.3s ease;
      position: relative;
      overflow: hidden;
      width: 100%;
    }

    .bio-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: -50%;
      width: 200%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--neon-color), var(--neon-secondary), transparent);
      opacity: 0.85;
    }

    .avatar-container {
      position: relative;
      width: 82px;
      height: 82px;
      margin: 0 auto;
    }

    .avatar-ring {
      position: absolute;
      inset: -3px;
      border-radius: 50%;
      background: conic-gradient(from 0deg, var(--neon-color), var(--neon-secondary), transparent 65%, var(--neon-color));
      animation: spinRing 4s linear infinite;
      filter: drop-shadow(0 0 8px var(--neon-glow));
    }

    @keyframes spinRing {
      100% { transform: rotate(360deg); }
    }

    .avatar-img {
      position: relative;
      width: 100%;
      height: 100%;
      border-radius: 50%;
      object-fit: cover;
      border: 2.5px solid #0b0b12;
      z-index: 2;
    }

    .status-dot {
      position: absolute;
      bottom: 2px;
      right: 2px;
      width: 16px;
      height: 16px;
      background: #22c55e;
      border: 3px solid #0f0f18;
      border-radius: 50%;
      z-index: 3;
      box-shadow: 0 0 8px #22c55e;
    }

    .username-glow {
      text-shadow: 0 0 12px var(--neon-glow);
    }

    .social-btn {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 0.65rem 1rem;
      background: rgba(255, 255, 255, 0.035);
      border: 1px solid rgba(255, 255, 255, 0.07);
      border-radius: 12px;
      color: #f1f5f9;
      text-decoration: none;
      transition: all 0.25s ease;
      position: relative;
      overflow: hidden;
    }

    .social-btn:hover {
      background: rgba(168, 85, 247, 0.12);
      border-color: var(--neon-color);
      transform: translateY(-2px);
      box-shadow: 0 6px 16px -4px var(--neon-glow);
    }

    .audio-control {
      position: fixed;
      bottom: 15px;
      left: 15px;
      z-index: 50;
      background: rgba(15, 15, 24, 0.75);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 0.5rem 0.8rem;
      border-radius: 999px;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .audio-control:hover {
      border-color: var(--neon-color);
      box-shadow: 0 0 12px var(--neon-glow);
    }
  </style>
</head>
<body>

  <div class="cyber-bg"></div>
  <div class="cyber-grid"></div>
  <canvas id="particleCanvas" class="fixed inset-0 pointer-events-none z-0"></canvas>

  <!-- Màn hình chờ Click to Enter -->
  <div id="enterOverlay">
    <div class="text-center px-4 pointer-events-none">
      <p class="pulse-text text-lg md:text-xl font-bold text-white uppercase">[ click to enter ]</p>
      <p class="text-xs text-slate-400 mt-3 font-mono">Bấm chuột bất kỳ đâu để vào Bio</p>
    </div>
  </div>

  <button id="audioBtn" onclick="toggleAudio()" class="audio-control text-xs font-mono text-slate-300">
    <i id="audioIcon" class="fa-solid fa-volume-high text-purple-400"></i>
    <span id="audioStatus">Đang phát nhạc</span>
  </button>

  <audio id="bgMusic" loop preload="auto">
    <source src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_c8c8a73467.mp3?filename=cyberpunk-2099-10701.mp3" type="audio/mpeg" />
  </audio>

  <div class="tilt-wrapper">
    <div id="bioCard" class="bio-card text-center">
      <div class="flex items-center justify-center mb-2.5">
        <span class="flex items-center gap-1.5 bg-white/5 px-2.5 py-0.5 rounded-full border border-white/10 text-xs font-mono text-slate-400">
          <i class="fa-regular fa-eye text-purple-400"></i>
          <span id="viewCounter">...</span>
        </span>
      </div>

      <div class="avatar-container">
        <div class="avatar-ring"></div>
        <img 
          src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=400&auto=format&fit=crop" 
          alt="Avatar" 
          class="avatar-img"
        />
        <span class="status-dot" title="Online"></span>
      </div>

      <h1 class="text-xl font-bold tracking-wide mt-3 username-glow flex items-center justify-center gap-1.5">
        <span>painkiller</span>
        <i class="fa-solid fa-circle-check text-purple-400 text-sm" title="Verified"></i>
      </h1>

      <div class="mt-1 h-5 flex items-center justify-center">
        <p class="text-xs font-mono text-slate-300">
          <span id="typewriterText"></span><span class="text-purple-400 animate-pulse">|</span>
        </p>
      </div>

      <div class="mt-3.5 space-y-2">
        <a href="https://discord.com/channels/@me" target="_blank" rel="noopener noreferrer" class="social-btn">
          <div class="flex items-center gap-2.5">
            <i class="fa-brands fa-discord text-base text-indigo-400 w-5 text-center"></i>
            <span class="font-medium text-xs">Discord Server</span>
          </div>
          <i class="fa-solid fa-arrow-up-right-from-square text-[11px] text-slate-400"></i>
        </a>

        <a href="https://github.com/WT-QuyPhong" target="_blank" rel="noopener noreferrer" class="social-btn">
          <div class="flex items-center gap-2.5">
            <i class="fa-brands fa-github text-base text-slate-200 w-5 text-center"></i>
            <span class="font-medium text-xs">GitHub Profile</span>
          </div>
          <i class="fa-solid fa-arrow-up-right-from-square text-[11px] text-slate-400"></i>
        </a>

        <a href="https://www.instagram.com/solion_osef/" target="_blank" rel="noopener noreferrer" class="social-btn">
          <div class="flex items-center gap-2.5">
            <i class="fa-brands fa-instagram text-base text-pink-500 w-5 text-center"></i>
            <span class="font-medium text-xs">Instagram</span>
          </div>
          <i class="fa-solid fa-arrow-up-right-from-square text-[11px] text-slate-400"></i>
        </a>

        <a href="https://www.facebook.com/nangvotinhchotachutthuonghainaotabaingodolatinhyeu?locale=vi_VN" target="_blank" rel="noopener noreferrer" class="social-btn">
          <div class="flex items-center gap-2.5">
            <i class="fa-brands fa-facebook text-base text-blue-400 w-5 text-center"></i>
            <span class="font-medium text-xs">Facebook Cá Nhân</span>
          </div>
          <i class="fa-solid fa-arrow-up-right-from-square text-[11px] text-slate-400"></i>
        </a>
      </div>

      <p class="mt-4 text-[10px] font-mono text-slate-500">
        © 2026 • painkiller
      </p>
    </div>
  </div>

  <script>
    const bioQuotes = [
      "Nothing lasts forever, everything will change one day.",
      "Welcome to my personal bio link 🌐"
      
    ];

    let quoteIndex = 0;
    let charIndex = 0;
    let isDeleting = false;
    const typeTarget = document.getElementById("typewriterText");

    function runTypewriter() {
      const currentQuote = bioQuotes[quoteIndex];
      if (isDeleting) {
        typeTarget.textContent = currentQuote.substring(0, charIndex - 1);
        charIndex--;
      } else {
        typeTarget.textContent = currentQuote.substring(0, charIndex + 1);
        charIndex++;
      }

      let speed = isDeleting ? 35 : 75;

      if (!isDeleting && charIndex === currentQuote.length) {
        speed = 2000;
        isDeleting = true;
      } else if (isDeleting && charIndex === 0) {
        isDeleting = false;
        quoteIndex = (quoteIndex + 1) % bioQuotes.length;
        speed = 400;
      }

      setTimeout(runTypewriter, speed);
    }
    runTypewriter();

    const overlay = document.getElementById("enterOverlay");
    const bgMusic = document.getElementById("bgMusic");
    const audioIcon = document.getElementById("audioIcon");
    const audioStatus = document.getElementById("audioStatus");

    function enterSite() {
      if (overlay.classList.contains("hidden-overlay")) return;
      overlay.classList.add("hidden-overlay");
      bgMusic.volume = 0.45;
      bgMusic.play().catch(() => {
        audioIcon.className = "fa-solid fa-volume-xmark text-slate-400";
        audioStatus.textContent = "Nhạc đang tắt";
      });
    }

    // Gắn sự kiện click toàn cục cho overlay để chắc chắn 100% ăn click
    overlay.addEventListener("click", enterSite);

    function toggleAudio() {
      if (bgMusic.paused) {
        bgMusic.play();
        audioIcon.className = "fa-solid fa-volume-high text-purple-400";
        audioStatus.textContent = "Đang phát nhạc";
      } else {
        bgMusic.pause();
        audioIcon.className = "fa-solid fa-volume-xmark text-slate-400";
        audioStatus.textContent = "Nhạc đang tắt";
      }
    }

    const card = document.getElementById("bioCard");
    document.addEventListener("mousemove", (e) => {
      const rect = card.getBoundingClientRect();
      const cardCenterX = rect.left + rect.width / 2;
      const cardCenterY = rect.top + rect.height / 2;
      const deltaX = e.clientX - cardCenterX;
      const deltaY = e.clientY - cardCenterY;

      const rotateX = Math.max(-8, Math.min(8, -deltaY / 30));
      const rotateY = Math.max(-8, Math.min(8, deltaX / 30));

      card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;
    });

    document.addEventListener("mouseleave", () => {
      card.style.transform = "rotateX(0deg) rotateY(0deg)";
    });

    const canvas = document.getElementById("particleCanvas");
    const ctx = canvas.getContext("2d");
    let particles = [];

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resizeCanvas);
    resizeCanvas();

    for (let i = 0; i < 35; i++) {
      particles.push({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        r: Math.random() * 1.5 + 0.5,
        dx: (Math.random() - 0.5) * 0.3,
        dy: (Math.random() - 0.5) * 0.3,
        alpha: Math.random() * 0.5 + 0.2
      });
    }

    function drawParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      particles.forEach((p) => {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(168, 85, 247, ${p.alpha})`;
        ctx.fill();

        p.x += p.dx;
        p.y += p.dy;

        if (p.x < 0) p.x = canvas.width;
        if (p.x > canvas.width) p.x = 0;
        if (p.y < 0) p.y = canvas.height;
        if (p.y > canvas.height) p.y = 0;
      });
      requestAnimationFrame(drawParticles);
    }
    drawParticles();

    async function updateRealViews() {
      const counterEl = document.getElementById("viewCounter");
      if (!counterEl) return;
      try {
        const res = await fetch("https://api.counterapi.dev/v1/wt_quyphong_personal/bio_views/up");
        const data = await res.json();
        if (data && typeof data.count === "number") {
          counterEl.textContent = data.count.toLocaleString("en-US");
        }
      } catch (err) {
        console.error("Không tải được bộ đếm:", err);
      }
    }
    updateRealViews();
  </script>
</body>
</html>
